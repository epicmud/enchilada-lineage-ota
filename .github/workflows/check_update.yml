name: Sync LineageOS OTA

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Execute Sync Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_FOLDER_ID: "1NajCZVFr2hXQVLXzKA-B4B2ePPZa2J7e"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x sync.sh
          ./sync.sh
